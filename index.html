<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111A22" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png" />

    <title>ShreeBuildcon | Builders, Developers &amp; Civil Contractors, Chh. Sambhajinagar</title>
    <meta
      name="description"
      content="ShreeBuildcon is a civil contracting, building and land development firm at Pisadevi, Chhatrapati Sambhajinagar. Industrial civil works, solar power plant infrastructure, government contracts and plotted development."
    />
    <link rel="canonical" href="%VITE_SITE_URL%/" />

    <!--
      Link previews. Crawlers (WhatsApp, Facebook, LinkedIn, X) will not resolve a
      relative image path, so these must be absolute — VITE_SITE_URL is set in .env
      and substituted at build time. Update it there when the domain is confirmed.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ShreeBuildcon" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:title" content="ShreeBuildcon — Builders &amp; Developers" />
    <meta
      property="og:description"
      content="Civil construction and land development at Pisadevi, Chhatrapati Sambhajinagar. Industrial civil works, solar plant infrastructure, government contracts and sanctioned residential plots."
    />
    <meta property="og:image" content="%VITE_SITE_URL%/share-image.jpg" />
    <meta property="og:image:secure_url" content="%VITE_SITE_URL%/share-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="ShreeBuildcon, builders and developers in Chhatrapati Sambhajinagar"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ShreeBuildcon — Builders &amp; Developers" />
    <meta
      name="twitter:description"
      content="Civil construction and land development at Pisadevi, Chhatrapati Sambhajinagar. Industrial civil works, solar plant infrastructure, government contracts and sanctioned residential plots."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/share-image.jpg" />
    <meta
      name="twitter:image:alt"
      content="ShreeBuildcon, builders and developers in Chhatrapati Sambhajinagar"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@500;600;700;800&family=Source+Sans+3:wght@300;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
